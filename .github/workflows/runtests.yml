name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev
  pull_request:

env:
  PTP_READ_TOKEN: ${{ secrets.PTP_READ_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.11"
          - "1.x"
        # Windows is deliberately absent: the generator writes through `mv`
        # semantics that have never been exercised there.
        os:
          - ubuntu-latest
          - macos-latest
        arch:
          - x64
        include:
          # Upload coverage from one leg only — parallel partial uploads race
          # codecov's merge and undercount.
          - os: ubuntu-latest
            version: "1.11"
            coverage: true

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v2

      - name: Add FuseRegistry
        run: |
          julia -e 'using Pkg; try; Pkg.Registry.rm("FuseRegistry"); catch; end; Pkg.Registry.add(RegistrySpec(url="https://github.com/ProjectTorreyPines/FuseRegistry.jl.git")); Pkg.Registry.add("General"); Pkg.Registry.update()'

      # `GenerateDD` is a private repo, so Pkg cannot clone it anonymously.
      # FuseRegistry now records plain `https://github.com/...` URLs (it used to
      # use `git@github.com:`), so both prefixes are rewritten to carry the read
      # token. `replace` scans once, so the two patterns cannot stack.
      - name: Inject PTP_READ_TOKEN into FuseRegistry URLs
        run: |
          julia -e '
            using Pkg
            registry_path = joinpath(first(DEPOT_PATH), "registries", "FuseRegistry")
            if isdir(registry_path)
              for (root, dirs, files) in walkdir(registry_path)
                for file in files
                  if endswith(file, "Package.toml")
                    filepath = joinpath(root, file)
                    content = read(filepath, String)
                    content = replace(content,
                      "git@github.com:" => "https://project-torrey-pines:${{secrets.PTP_READ_TOKEN}}@github.com/",
                      "https://github.com/" => "https://project-torrey-pines:${{secrets.PTP_READ_TOKEN}}@github.com/")
                    write(filepath, content)
                  end
                end
              end
            end
          '

      - name: Install dependencies
        run: |
          julia -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
          '

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage || false }}

      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ matrix.coverage }}
        with:
          # `ext/` holds the Plots recipes, which the generated container tests reach
          directories: src,ext

      - uses: codecov/codecov-action@v5
        if: ${{ matrix.coverage }}
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
