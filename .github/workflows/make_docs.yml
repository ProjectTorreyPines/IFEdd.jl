name: Make Docs

on:
  pull_request:
    branches: ["master"]
    paths:
      - "src/**"
      - "ext/**"
      - "docs/**"
      - "examples/**"
      - "data_dictionary/**"
      - "Project.toml"
      - ".github/workflows/make_docs.yml"
  push:
    branches:
      - master
    tags: '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-docs
  cancel-in-progress: true

jobs:
  make_docs:
    permissions:
      contents: write
      statuses: write
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@latest

      - uses: julia-actions/cache@v2

      - name: Add FuseRegistry
        run: |
          rm -rf ~/.julia/registries/FuseRegistry
          julia -e 'using Pkg; Pkg.Registry.add(RegistrySpec(url="https://github.com/ProjectTorreyPines/FuseRegistry.jl.git")); Pkg.Registry.add("General"); Pkg.Registry.update()'

      # `GenerateDD` is a private repo, so Pkg cannot clone it anonymously.
      # FuseRegistry now records plain `https://github.com/...` URLs (it used to
      # use `git@github.com:`), so both prefixes are rewritten to carry the read
      # token. The second expression cannot re-match what the first produced.
      - name: Inject PTP_READ_TOKEN into FuseRegistry URLs
        run: |
          find ~/.julia/registries/FuseRegistry -type f -name 'Package.toml' -exec sed -i \
            -e 's|git@github.com:|https://project-torrey-pines:${{secrets.PTP_READ_TOKEN}}@github.com/|g' \
            -e 's|https://github.com/|https://project-torrey-pines:${{secrets.PTP_READ_TOKEN}}@github.com/|g' {} +

      # TEMPORARY — remove once IMASdd 8.6.3 is registered.
      # Released IMASdd v8.6.2 resolves IDS metadata by location string, which
      # only sees structs defined inside the IMASdd module; a satellite-owned
      # struct like `IFEdd.summary__target` is invisible to it, so every
      # `@example` that shows an IFEdd IDS dies with `UndefVarError`. The fix
      # (IMASdd PR #108, type-based lookup) is merged on master but unreleased —
      # master still reports version 8.6.2, so `[compat] IMASdd = "8.6.2"` is
      # satisfied and the resolver keeps the pinned checkout.
      # `develop` must precede `add`: IFEdd is unregistered, so a resolve
      # triggered before it is a path-dep fails with "expected package IFEdd
      # [b7ef78e8] to be registered".
      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.activate("docs")
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.add(PackageSpec(url="https://github.com/ProjectTorreyPines/IMASdd.jl.git", rev="master"))
            Pkg.instantiate()
            Pkg.status()
          '

      # The pages are built from `@example` blocks, so this executes every
      # published snippet — a stale example fails the build.
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
